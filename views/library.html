<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Learned skills</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: calc(var(--pi-plugin-titlebar-height, 0px) + 12px) 14px 16px;
        font: 13px/1.45 system-ui, sans-serif;
        color: CanvasText;
      }
      h1 {
        font-size: 14px;
        font-weight: 650;
        margin: 0 0 8px;
      }
      .meta {
        color: GrayText;
        margin-bottom: 12px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
        padding: 8px 0;
      }
      .name {
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .tag {
        font-weight: 500;
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        color: GrayText;
      }
      .desc {
        color: GrayText;
      }
      button {
        margin-top: 8px;
      }
      .err {
        color: tomato;
      }
    </style>
  </head>
  <body>
    <h1>已学技能</h1>
    <div class="meta" id="meta">加载中…</div>
    <ul id="list"></ul>
    <button id="reload" type="button">刷新</button>
    <script>
      async function load() {
        const meta = document.getElementById("meta");
        const list = document.getElementById("list");
        list.innerHTML = "";
        try {
          const data = await window.pluginBridge.invoke("library.list", {});
          if (data && data.error) throw new Error(data.error);
          const skills = (data && data.skills) || [];
          meta.textContent = `${skills.length} 个 · ${data.root || ""}`;
          for (const s of skills) {
            const li = document.createElement("li");
            li.innerHTML = `<div class="name">${escapeHtml(s.name)} <span class="tag">自习</span></div><div class="desc">${escapeHtml(s.description || "")}</div>`;
            list.appendChild(li);
          }
          if (!skills.length) {
            const li = document.createElement("li");
            li.textContent = "还没有 learned skill。完成一轮复杂任务，或在对话里 /learn。";
            list.appendChild(li);
          }
        } catch (err) {
          meta.innerHTML = `<span class="err">${escapeHtml(String(err && err.message ? err.message : err))}</span>`;
        }
      }
      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      document.getElementById("reload").addEventListener("click", () => void load());
      void load();
    </script>
  </body>
</html>
